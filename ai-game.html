<!DOCTYPE html>

<head>

    <title>Pexeso for Mydli — vs Computer</title>
    <link rel="stylesheet" href="butterfly.css">
    <style>
        @font-face {
            font-family: 'Great Vibes';
            src: url('fonts/greatvibes.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Playfair Display';
            src: url('fonts/playfair.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Cinzel';
            src: url('fonts/cinzel.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        button { background: none; border: none; padding: 0; cursor: pointer; }

        .game-grid {
            display: grid;
            gap: 0.3rem;
        }
        .game-grid.easy   { grid-template-columns: repeat(4, 1fr); }
        .game-grid.medium { grid-template-columns: repeat(5, 1fr); }
        .game-grid.hard   { grid-template-columns: repeat(6, 1fr); }

        .card-button {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 0.5rem;
            transition: all 0.3s;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 0.25rem;
        }

        @media (max-width: 640px) {
            .game-grid { gap: 0.15rem; }
            .card-button { border-radius: 0.25rem; }
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <script src="lib/confetti.min.js"></script>

        // ── CARD GENERATION ──────────────────────────────────────
        function generateCards(seed, pairs, categoryKey) {
            let s = seed;
            const rng = () => {
                s |= 0; s = s + 0x6D2B79F5 | 0;
                let t = Math.imul(s ^ s >>> 15, 1 | s);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
            const fisherYates = (arr) => {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(rng() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            };
            const cat = categories[categoryKey] || categories.animals;
            const images = fisherYates(cat.images).slice(0, pairs);
            const cardValues = [];
            for (let i = 0; i < pairs; i++) cardValues.push(i, i);
            return fisherYates(cardValues).map(value => ({
                value,
                color: colors[value % colors.length],
                animal: images[value],
            }));
        }

        // ── CONFETTI ─────────────────────────────────────────────
        function launchConfetti() {
            if (typeof confetti === 'undefined') return;
            const end = Date.now() + 3000;
            (function frame() {
                confetti({ particleCount: 3, angle: 60,  spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            })();
        }

        // ── AI LOGIC ─────────────────────────────────────────────
        // aiMemory: Map<cardIndex, cardValue>  — what the AI has seen
        function aiChoose(cards, matched, aiMemory, difficulty) {
            const memChance = aiMemoryChance[difficulty] || 0.7;
            const unmatched = cards
                .map((_, i) => i)
                .filter(i => !matched.includes(i));

            // 1. Do we know a complete pair in memory?
            const knownValues = new Map(); // value → [indices]
            for (const [idx, val] of aiMemory.entries()) {
                if (matched.includes(idx)) continue;
                if (!knownValues.has(val)) knownValues.set(val, []);
                knownValues.get(val).push(idx);
            }
            for (const [, indices] of knownValues.entries()) {
                if (indices.length >= 2) {
                    return { first: indices[0], second: indices[1], fromMemory: true };
                }
            }

            // 2. Pick a random unknown card as first flip
            const unknown = unmatched.filter(i => !aiMemory.has(i));
            const firstPool = unknown.length > 0 ? unknown : unmatched;
            const first = firstPool[Math.floor(Math.random() * firstPool.length)];
            const firstVal = cards[first].value;

            // 3. Check if we know the match for it
            for (const [idx, val] of aiMemory.entries()) {
                if (val === firstVal && idx !== first && !matched.includes(idx)) {
                    return { first, second: idx, fromMemory: true };
                }
            }

            // 4. Pick a random second card (not first, not matched)
            const secondPool = unmatched.filter(i => i !== first);
            const second = secondPool[Math.floor(Math.random() * secondPool.length)];
            return { first, second, fromMemory: false };
        }

        // ── MAIN COMPONENT ───────────────────────────────────────
        function AIGame() {
            // Read URL params
            const params = new URLSearchParams(window.location.search);
            const categoryKey  = params.get('category')   || 'animals';
            const difficultyKey = params.get('difficulty') || 'easy';
            const config = difficultyConfig[difficultyKey] || difficultyConfig.easy;
            const PAIRS = config.pairs;
            const TOTAL_CARDS = PAIRS * 2;

            const [cards, setCards]             = useState([]);
            const [flipped, setFlipped]         = useState([]);
            const [matched, setMatched]         = useState([]);
            const [scores, setScores]           = useState({ player: 0, ai: 0 });
            const [currentTurn, setCurrentTurn] = useState('player'); // 'player' | 'ai'
            const [canFlip, setCanFlip]         = useState(true);
            const [gameOver, setGameOver]       = useState(false);
            const [message, setMessage]         = useState('');

            // Refs for closures
            const cardsRef       = useRef([]);
            const matchedRef     = useRef([]);
            const flippedRef     = useRef([]);
            const scoresRef      = useRef({ player: 0, ai: 0 });
            const currentTurnRef = useRef('player');
            const aiMemory       = useRef(new Map()); // index → value

            // Init game
            useEffect(() => {
                startNewGame();
            }, []);

            function startNewGame() {
                const seed = Math.floor(Math.random() * 1e9);
                const newCards = generateCards(seed, PAIRS, categoryKey);
                cardsRef.current   = newCards;
                matchedRef.current = [];
                flippedRef.current = [];
                scoresRef.current  = { player: 0, ai: 0 };
                currentTurnRef.current = 'player';
                aiMemory.current   = new Map();
                setCards(newCards);
                setFlipped([]);
                setMatched([]);
                setScores({ player: 0, ai: 0 });
                setCurrentTurn('player');
                setCanFlip(true);
                setGameOver(false);
                setMessage('Your turn!');
            }

            // AI learns about a revealed card
            function aiLearn(index, value) {
                const chance = aiMemoryChance[difficultyKey] || 0.7;
                if (Math.random() < chance) {
                    aiMemory.current.set(index, value);
                }
            }

            // Process a flip of two cards (shared logic)
            function processPair(first, second, actor) {
                const curCards   = cardsRef.current;
                const curMatched = matchedRef.current;
                const curScores  = scoresRef.current;

                const isMatch = curCards[first].value === curCards[second].value;

                if (isMatch) {
                    setTimeout(() => {
                        const newMatched = [...curMatched, first, second];
                        const newScores  = { ...curScores, [actor]: curScores[actor] + 1 };
                        matchedRef.current = newMatched;
                        scoresRef.current  = newScores;
                        flippedRef.current = [];
                        setMatched(newMatched);
                        setScores(newScores);
                        setFlipped([]);

                        if (newMatched.length === TOTAL_CARDS) {
                            setGameOver(true);
                            if (newScores.player > newScores.ai) launchConfetti();
                            setCanFlip(false);
                            return;
                        }

                        // Same player/AI gets another turn on match
                        if (actor === 'player') {
                            setCurrentTurn('player');
                            currentTurnRef.current = 'player';
                            setCanFlip(true);
                            setMessage('Match! Your turn again!');
                        } else {
                            setMessage('AI found a match!');
                            scheduleAITurn(newMatched);
                        }
                    }, 700);
                } else {
                    setTimeout(() => {
                        flippedRef.current = [];
                        setFlipped([]);

                        const nextTurn = actor === 'player' ? 'ai' : 'player';
                        currentTurnRef.current = nextTurn;
                        setCurrentTurn(nextTurn);

                        if (nextTurn === 'player') {
                            setCanFlip(true);
                            setMessage('No match. Your turn!');
                        } else {
                            setCanFlip(false);
                            setMessage("AI's turn...");
                            scheduleAITurn(curMatched);
                        }
                    }, 900);
                }
            }

            // Schedule AI move with a realistic delay
            function scheduleAITurn(currentMatched) {
                setTimeout(() => {
                    const curCards   = cardsRef.current;
                    const curMatched = currentMatched || matchedRef.current;

                    if (curMatched.length === TOTAL_CARDS) return;

                    const { first, second } = aiChoose(curCards, curMatched, aiMemory.current, difficultyKey);
                    if (first === undefined || second === undefined) return;

                    // Flip first card
                    flippedRef.current = [first];
                    setFlipped([first]);
                    aiLearn(first, curCards[first].value);

                    setTimeout(() => {
                        // Flip second card
                        flippedRef.current = [first, second];
                        setFlipped([first, second]);
                        aiLearn(second, curCards[second].value);

                        processPair(first, second, 'ai');
                    }, 700);
                }, 1000);
            }

            // Player clicks a card
            function handleCardClick(index) {
                if (currentTurnRef.current !== 'player') return;
                if (!canFlip) return;
                if (flippedRef.current.includes(index)) return;
                if (matchedRef.current.includes(index)) return;

                const newFlipped = [...flippedRef.current, index];
                flippedRef.current = newFlipped;
                setFlipped(newFlipped);

                // AI learns what the player flips
                aiLearn(index, cardsRef.current[index].value);

                if (newFlipped.length === 2) {
                    setCanFlip(false);
                    processPair(newFlipped[0], newFlipped[1], 'player');
                }
            }

            const isPlayerTurn = currentTurn === 'player';

            // ── GAME OVER SCREEN ─────────────────────────────────
            if (gameOver) {
                const playerWon = scores.player > scores.ai;
                const draw      = scores.player === scores.ai;
                return (
                    <div className="min-h-screen flex items-center justify-center p-4"
                        style={{ backgroundImage: 'url(images/meadow.png)', backgroundSize: 'cover', backgroundPosition: 'center' }}>
                        <div className="rounded-2xl shadow-2xl p-8 max-w-sm w-full border border-yellow-500 text-center"
                            style={{ backgroundColor: 'rgba(181,101,29,0.9)' }}>
                            <h1 className="text-4xl text-yellow-400 mb-4" style={{ fontFamily: 'Great Vibes, cursive' }}>
                                {draw ? "It's a draw!" : playerWon ? 'You won! 🎉' : 'Computer won!'}
                            </h1>
                            <p className="text-white text-xl mb-6">
                                You: <strong>{scores.player}</strong> &nbsp;|&nbsp; AI: <strong>{scores.ai}</strong>
                            </p>
                            <div className="space-y-3">
                                <button onClick={startNewGame}
                                    className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg text-lg">
                                    Play again
                                </button>
                                <button onClick={() => window.location.href = 'index.html'}
                                    className="w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 rounded-lg text-lg">
                                    Main menu
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ── GAME SCREEN ──────────────────────────────────────
            return (
                <div className="h-screen p-2 flex flex-col overflow-hidden"
                    style={{ backgroundImage: 'url(images/meadow.png)', backgroundSize: 'cover', backgroundPosition: 'center' }}>

                    <div className="w-full h-full flex flex-col max-w-2xl mx-auto">

                        {/* Header */}
                        <div className="flex items-center justify-between mb-1">
                            <button onClick={() => window.location.href = 'index.html'}
                                className="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm font-bold">
                                ← Menu
                            </button>
                            <h1 className="text-xl md:text-2xl font-bold text-white text-center flex-1"
                                style={{ fontFamily: 'Great Vibes, cursive' }}>
                                Pexeso <span className="text-[10px] text-white/70 relative -top-2 ml-1">for Mydli</span>
                            </h1>
                            <div className="w-16"></div>
                        </div>

                        {/* Score bar */}
                        <div className="bg-gray-800 rounded-lg shadow-xl p-1 mb-1 flex-shrink-0 border border-yellow-700">
                            <div className="flex justify-around items-center">
                                <div className={`text-center transition-all ${isPlayerTurn ? 'scale-110' : 'opacity-60'}`}>
                                    <div className="text-xs font-bold text-blue-400">👤 You</div>
                                    <div className="text-2xl font-bold text-white">{scores.player}</div>
                                </div>
                                <div className="text-center px-2">
                                    <div className="text-white text-xs font-bold px-3 py-1 rounded-lg"
                                        style={{ backgroundColor: isPlayerTurn ? 'rgba(59,130,246,0.5)' : 'rgba(239,68,68,0.5)' }}>
                                        {message}
                                    </div>
                                    <div className="text-gray-400 text-xs mt-1">{config.name}</div>
                                </div>
                                <div className={`text-center transition-all ${!isPlayerTurn ? 'scale-110' : 'opacity-60'}`}>
                                    <div className="text-xs font-bold text-red-400">🤖 AI</div>
                                    <div className="text-2xl font-bold text-white">{scores.ai}</div>
                                </div>
                            </div>
                        </div>

                        {/* Card grid */}
                        <div className="bg-gray-800 rounded-lg shadow-xl p-2 flex-1 overflow-hidden border border-gray-700 min-h-0">
                            <div className={`game-grid ${difficultyKey}`}
                                style={{ height: '100%', gridTemplateRows: `repeat(${config.rows}, 1fr)` }}>
                                {cards.map((card, index) => {
                                    const isFlipped = flipped.includes(index);
                                    const isMatched = matched.includes(index);
                                    return (
                                        <button
                                            key={index}
                                            onClick={() => handleCardClick(index)}
                                            className={`card-button transition-all duration-300 ${isMatched ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
                                            style={{
                                                backgroundColor: isFlipped || isMatched ? 'transparent' : '#6B7280',
                                                cursor: canFlip && isPlayerTurn && !isFlipped && !isMatched ? 'pointer' : 'default',
                                            }}
                                            disabled={!canFlip || !isPlayerTurn || isFlipped || isMatched}
                                        >
                                            <div className="w-full h-full flex items-center justify-center">
                                                {(isFlipped || isMatched) ? (
                                                    <img src={card.animal} alt="card" className="card-image" />
                                                ) : (
                                                    <div className="flex flex-col items-center justify-center h-full">
                                                        <span className="text-black text-lg md:text-xl leading-tight"
                                                            style={{ fontFamily: 'Great Vibes, cursive' }}>Pexeso</span>
                                                        <span className="text-black text-[8px] md:text-[10px] leading-none"
                                                            style={{ fontFamily: 'Great Vibes, cursive' }}>for Mydli</span>
                                                    </div>
                                                )}
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        ReactDOM.render(<AIGame />, document.getElementById('root'));
    </script>
