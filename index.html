<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#9333ea">
    <meta name="description" content="Pexeso - Hra pro dva hráče">
    <title>Pexeso</title>
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiUGV4ZXNvIiwic2hvcnRfbmFtZSI6IlBleGVzbyIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjOTMzM2VhIiwidGhlbWVfY29sb3IiOiIjOTMzM2VhIn0=">
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const PexesoGame = () => {
          const ROWS = 10;
          const COLS = 6;
          const TOTAL_CARDS = ROWS * COLS;
          const PAIRS = TOTAL_CARDS / 2;

          const [cards, setCards] = useState([]);
          const [flipped, setFlipped] = useState([]);
          const [matched, setMatched] = useState([]);
          const [currentPlayer, setCurrentPlayer] = useState(1);
          const [scores, setScores] = useState({ player1: 0, player2: 0 });
          const [canFlip, setCanFlip] = useState(true);

          const animals = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', 
                          '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🐤', '🦆',
                          '🦅', '🦉', '🦇', '🐺', '🐗', '🐴', '🦄', '🐝', '🐛', '🦋'];

          const colors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
            '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739', '#52BE80',
            '#EC7063', '#5DADE2', '#F5B041', '#AF7AC5', '#48C9B0',
            '#EB984E', '#7FB3D5', '#73C6B6', '#F1948A', '#85929E',
            '#D5DBDB', '#AED6F1', '#FADBD8', '#D7BDE2', '#A9DFBF',
            '#FAD7A0', '#D6EAF8', '#FCF3CF', '#E8DAEF', '#D1F2EB'
          ];

          useEffect(() => {
            initGame();
          }, []);

          const initGame = () => {
            const cardValues = [];
            for (let i = 0; i < PAIRS; i++) {
              cardValues.push(i, i);
            }
            
            const shuffled = cardValues
              .map(value => ({ value, color: colors[value % colors.length], animal: animals[value % animals.length], sort: Math.random() }))
              .sort((a, b) => a.sort - b.sort)
              .map(({ value, color, animal }) => ({ value, color, animal }));
            
            setCards(shuffled);
            setFlipped([]);
            setMatched([]);
            setCurrentPlayer(1);
            setScores({ player1: 0, player2: 0 });
            setCanFlip(true);
          };

          const handleCardClick = (index) => {
            if (!canFlip || flipped.includes(index) || matched.includes(index) || flipped.length >= 2) {
              return;
            }

            const newFlipped = [...flipped, index];
            setFlipped(newFlipped);

            if (newFlipped.length === 2) {
              setCanFlip(false);
              const [first, second] = newFlipped;
              
              if (cards[first].value === cards[second].value) {
                setTimeout(() => {
                  setMatched([...matched, first, second]);
                  setScores(prev => ({
                    ...prev,
                    [`player${currentPlayer}`]: prev[`player${currentPlayer}`] + 1
                  }));
                  setFlipped([]);
                  setCanFlip(true);
                }, 500);
              } else {
                setTimeout(() => {
                  setFlipped([]);
                  setCurrentPlayer(currentPlayer === 1 ? 2 : 1);
                  setCanFlip(true);
                }, 400);
              }
            }
          };

          const isGameOver = matched.length === TOTAL_CARDS;

          return (
            <div className="h-screen bg-gradient-to-br from-purple-600 via-pink-500 to-red-500 p-2 flex flex-col overflow-hidden">
              <div className="w-full h-full flex flex-col max-w-2xl mx-auto">
                <h1 className="text-xl md:text-2xl font-bold text-white text-center mb-1 flex-shrink-0">🎮 Pexeso</h1>
                
                <div className="bg-white rounded-lg shadow-xl p-2 mb-1 flex-shrink-0">
                  <div className="flex justify-between items-center">
                    <div className={`flex-1 p-1.5 rounded-lg ${currentPlayer === 1 && !isGameOver ? 'bg-blue-500 text-white' : 'bg-gray-200'}`}>
                      <div className="text-xs md:text-sm font-bold">Hráč 1</div>
                      <div className="text-lg md:text-2xl font-bold">{scores.player1}</div>
                    </div>
                    
                    <button
                      onClick={initGame}
                      className="mx-1.5 bg-green-500 hover:bg-green-600 text-white p-2 rounded-full shadow-lg transition-transform hover:scale-110"
                      title="Nová hra"
                    >
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                      </svg>
                    </button>

                    <button
                      className="mx-1.5 bg-purple-500 text-white px-3 py-2 rounded-lg shadow-lg text-xs font-bold opacity-50 cursor-not-allowed"
                      title="Online multiplayer (zatím nedostupný)"
                      disabled
                    >
                      🌐 Online
                    </button>
                    
                    <div className={`flex-1 p-1.5 rounded-lg ${currentPlayer === 2 && !isGameOver ? 'bg-red-500 text-white' : 'bg-gray-200'}`}>
                      <div className="text-xs md:text-sm font-bold">Hráč 2</div>
                      <div className="text-lg md:text-2xl font-bold">{scores.player2}</div>
                    </div>
                  </div>

                  {isGameOver && (
                    <div className="text-center p-1.5 mt-1 bg-yellow-100 rounded-lg border-2 border-yellow-500">
                      <div className="text-base md:text-xl font-bold">🎉 Konec hry! 🎉</div>
                      <div className="text-sm md:text-lg">
                        {scores.player1 > scores.player2 ? 'Vyhrál Hráč 1!' : 
                         scores.player2 > scores.player1 ? 'Vyhrál Hráč 2!' : 
                         'Remíza!'}
                      </div>
                    </div>
                  )}
                </div>

                <div className="bg-white rounded-lg shadow-xl p-2 flex-1 overflow-hidden">
                  <div 
                    className="grid gap-1 h-full w-full"
                    style={{
                      gridTemplateColumns: `repeat(6, 1fr)`,
                      gridTemplateRows: `repeat(10, 1fr)`
                    }}
                  >
                    {cards.map((card, index) => {
                      const isFlipped = flipped.includes(index);
                      const isMatched = matched.includes(index);
                      
                      return (
                        <button
                          key={index}
                          onClick={() => handleCardClick(index)}
                          className={`w-full h-full rounded-lg transition-all duration-300 ${
                            isMatched ? 'opacity-50' : 'opacity-100'
                          }`}
                          style={{
                            backgroundColor: isFlipped || isMatched ? card.color : '#6B7280',
                            cursor: canFlip && !isFlipped && !isMatched ? 'pointer' : 'default'
                          }}
                          disabled={!canFlip || isFlipped || isMatched}
                        >
                          <div className="w-full h-full flex items-center justify-center">
                            {(isFlipped || isMatched) ? (
                              <span className="text-4xl md:text-5xl">{card.animal}</span>
                            ) : (
                              <span className="text-white text-base md:text-xl font-bold">?</span>
                            )}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        ReactDOM.render(<PexesoGame />, document.getElementById('root'));
    </script>
</body>
</html>
