    <style>
      body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    touch-action: manipulation;
    background-color: #1a1a2e;
}

.card-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 2px;
    background-color: transparent;
    display: block;
}

.game-grid {
    display: grid;
    gap: 0.25rem;
    width: 100%;
    height: 100%;
    margin: 0 auto;
}

/* Easy: 5×4 (portrait) nebo 4×5 (landscape) */
@media (orientation: portrait) {
    .game-grid.easy {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(5, 1fr);
        max-width: 40vh;
    }
}

@media (orientation: landscape) {
    .game-grid.easy {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(4, 1fr);
        max-width: 50vh;
    }
}

/* Medium: 8×5 (portrait) nebo 5×8 (landscape) */
@media (orientation: portrait) {
    .game-grid.medium {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(8, 1fr);
        max-width: 50vh;
    }
}

@media (orientation: landscape) {
    .game-grid.medium {
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(5, 1fr);
        max-width: 80vh;
    }
}

/* Hard: 10×6 (portrait) nebo 6×10 (landscape) */
@media (orientation: portrait) {
    .game-grid.hard {
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(10, 1fr);
        max-width: 60vh;
    }
}

@media (orientation: landscape) {
    .game-grid.hard {
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(6, 1fr);
        max-width: 100vh;
    }
}

.card-button {
    width: 100%;
    height: 100%;
    position: relative;
    border-radius: 0.5rem;
    transition: all 0.3s;
}

@media (max-width: 640px) {
    .game-grid {
        gap: 0.15rem;
    }
    .card-button {
        border-radius: 0.25rem;
    }
}
    </style>
</head>
<body>
<canvas id="confetti-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;"></canvas>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Firebase konfigurace
        const firebaseConfig = {
            apiKey: "AIzaSyBLtCRf4_OYedrTrdizRRCFLN0FIk-bnIE",
            authDomain: "pexeso-game.firebaseapp.com",
            databaseURL: "https://pexeso-game-default-rtdb.europe-west1.firebasedatabase.app",

            appId: "1:1770108821:web:53089614906957421fe89c",
            measurementId: "G-G0Y3QV8L2W"
        };

        // Inicializace Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // Konfigurace obtížností
        const difficultyConfig = {
            easy: { rows: 5, cols: 4, pairs: 10, name: "Easy" },
            medium: { rows: 8, cols: 5, pairs: 20, name: "Medium" },
            hard: { rows: 10, cols: 6, pairs: 30, name: "Hard" }
        };

        // === KATEGORIE OBRÁZKŮ ===
        const categories = {
            animals: {
                name: "Animals",
                images: [
                    'images/animals/amstaf.png', 'images/animals/bear.png', 'images/animals/bengal.png',
                    'images/animals/bird.png', 'images/animals/bonemouth.png', 'images/animals/butterfly.png',
                    'images/animals/cat.png', 'images/animals/chicken.png', 'images/animals/cobra.png',
                    'images/animals/dog.png', 'images/animals/dolphin.png', 'images/animals/elephant.png',
                    'images/animals/fenix.png', 'images/animals/fish.png', 'images/animals/frog.png',
                    'images/animals/girafe.png', 'images/animals/goat.png', 'images/animals/gorila.png',
                    'images/animals/hamster.png', 'images/animals/horse.png', 'images/animals/kokr.png',
                    'images/animals/labrador.png', 'images/animals/labut.png', 'images/animals/leguan.png',
                    'images/animals/levhart.png', 'images/animals/lion.png', 'images/animals/monkey.png',
                    'images/animals/motyl.png', 'images/animals/neon.png', 'images/animals/parrot.png',
                    'images/animals/pav.png', 'images/animals/pelikan.png', 'images/animals/pinguin.png',
                    'images/animals/retrivr.png', 'images/animals/rotvik.png', 'images/animals/skalar.png',
                    'images/animals/star.png', 'images/animals/sykora.png', 'images/animals/tiger.png',
                    'images/animals/turtle.png', 'images/animals/vlcak.png', 'images/animals/wolf.png',
                    'images/animals/bluecat.png', 'images/animals/catty.png', 'images/animals/duck.png',
                    'images/animals/holub.png', 'images/animals/jelen.png', 'images/animals/jezek.png',
                    'images/animals/klaun.png', 'images/animals/krocan.png', 'images/animals/lasice.png',
                    'images/animals/liska.png', 'images/animals/lvhart.png', 'images/animals/makak.png',
                    'images/animals/mlok.png', 'images/animals/myval.png', 'images/animals/pelikan2.png',
                    'images/animals/pitbull.png', 'images/animals/pomci.png', 'images/animals/puma.png',
                    'images/animals/redpanda.png', 'images/animals/shark.png', 'images/animals/slune.png',
                    'images/animals/snek.png', 'images/animals/srnce.png', 'images/animals/treska.png',
                    'images/animals/zajic.png', 'images/animals/zebra.png', 'images/animals/zluva.png'
                ]
            },
            biblical: {
                name: "Biblical",
                images: [
                    "images/biblical/aron.png", "images/biblical/baptizo.png", "images/biblical/Dorkas.png",
                    "images/biblical/farizeus.png", "images/biblical/fish.png", "images/biblical/fisherman.png",
                    "images/biblical/grave.png", "images/biblical/herodes.png", "images/biblical/jericho.png",
                    "images/biblical/jesus.png", "images/biblical/jesuscloud.png", "images/biblical/jesuszjeveni.png",
                    "images/biblical/jidas.png", "images/biblical/john.png", "images/biblical/Josef.png",
                    "images/biblical/jozue2.png", "images/biblical/lazar.png", "images/biblical/maria.png",
                    "images/biblical/moses.png", "images/biblical/natanael.png", "images/biblical/onezim.png",
                    "images/biblical/oslatko.png", "images/biblical/ovce.png", "images/biblical/palm.png",
                    "images/biblical/paul.png", "images/biblical/sea.png", "images/biblical/snake.png",
                    "images/biblical/sun.png", "images/biblical/wine.png", "images/biblical/zebedej.png",
 		    "images/biblical/arch.png", "images/biblical/bloud.png", "images/biblical/JESUSrisen.png",
 		    "images/biblical/krize.png", "images/biblical/net.png", "images/biblical/perla.png",
 		    "images/biblical/prayer.png", "images/biblical/roman.png", "images/biblical/seastorm.png",
		    "images/biblical/angels.png", "images/biblical/bread.png", "images/biblical/jerusalem.png",
		    "images/biblical/jesuspilat.png", "images/biblical/koruna.png", "images/biblical/stone.png",
		    "images/biblical/ucho.png", "images/biblical/uzdraveni.png",
 		    "images/biblical/shalom.png", "images/biblical/stanek.png", "images/biblical/svitek.png"
                ]
            }
        };

        const colors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
            '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739', '#52BE80',
            '#EC7063', '#5DADE2', '#F5B041', '#AF7AC5', '#48C9B0',
            '#EB984E', '#7FB3D5', '#73C6B6', '#F1948A', '#85929E',
            '#D5DBDB', '#AED6F1', '#FADBD8', '#D7BDE2', '#A9DFBF',
            '#FAD7A0', '#D6EAF8', '#FCF3CF', '#E8DAEF', '#D1F2EB'
        ];

        const PexesoGame = () => {
            const [gameMode, setGameMode] = useState('menu');
            const [selectedCategory, setSelectedCategory] = useState('animals');
            const [selectedDifficulty, setSelectedDifficulty] = useState('hard');
            const [roomCode, setRoomCode] = useState('');
            const [joinCode, setJoinCode] = useState('');
            const [playerNumber, setPlayerNumber] = useState(null);
            const [waitingForPlayer, setWaitingForPlayer] = useState(false);
            
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);
            const [currentPlayer, setCurrentPlayer] = useState(1);
            const [scores, setScores] = useState({ player1: 0, player2: 0 });
            const [canFlip, setCanFlip] = useState(true);
            
            const [matchWins, setMatchWins] = useState({ player1: 0, player2: 0 });
            const [readyForNextRound, setReadyForNextRound] = useState({ player1: false, player2: false });

            const roomRef = useRef(null);
            const isOnline = gameMode === 'online';

            const currentConfig = difficultyConfig[selectedDifficulty];
            const TOTAL_CARDS = currentConfig.rows * currentConfig.cols;
            const PAIRS = currentConfig.pairs;

useEffect(() => {
  if (isGameOver && scores.player1 !== scores.player2) {
    launchConfetti();
  }
}, [isGameOver, scores]);



            const getRandomImages = (count, categoryKey) => {
                const cat = categories[categoryKey];
                if (!cat || cat.images.length < count) return [];
                const shuffled = [...cat.images].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, count);
            };

            const generateRoomCode = () => {
                return Math.floor(10000 + Math.random() * 90000).toString();
            };

            const createRoom = async () => {
                const code = generateRoomCode();
                const selectedImages = getRandomImages(PAIRS, selectedCategory);
                
                const cardValues = [];
                for (let i = 0; i < PAIRS; i++) {
                    cardValues.push(i, i);
                }
                
                const shuffled = cardValues
                    .map(value => ({ 
                        value, 
                        color: colors[value % colors.length], 
                        animal: selectedImages[value],
                        sort: Math.random() 
                    }))
                    .sort((a, b) => a.sort - b.sort)
                    .map(({ value, color, animal }) => ({ value, color, animal }));

                await database.ref('rooms/' + code).set({
                    cards: shuffled,
                    flipped: [],
                    matched: [],
                    currentPlayer: 1,
                    scores: { player1: 0, player2: 0 },
                    matchWins: { player1: 0, player2: 0 },
                    readyForNextRound: { player1: false, player2: false },
                    players: { player1: true, player2: false },
                    category: selectedCategory,
                    difficulty: selectedDifficulty,
                    createdAt: Date.now()
                });

                setRoomCode(code);
                setPlayerNumber(1);
                setGameMode('online');
                setWaitingForPlayer(true);
                listenToRoom(code);
            };

            const joinRoom = async () => {
                if (!joinCode.trim()) return;
                
                const code = joinCode.trim().toUpperCase();
                const roomSnapshot = await database.ref('rooms/' + code).once('value');
                
                if (!roomSnapshot.exists()) {
                    alert('Místnost nenalezena!');
                    return;
                }

                const roomData = roomSnapshot.val();
                if (roomData.players.player2) {
                    alert('Místnost je plná!');
                    return;
                }

                setSelectedCategory(roomData.category || 'animals');
                setSelectedDifficulty(roomData.difficulty || 'hard');

                await database.ref('rooms/' + code + '/players/player2').set(true);
                
                setRoomCode(code);
                setPlayerNumber(2);
                setGameMode('online');
                setWaitingForPlayer(false);
                listenToRoom(code);
            };

            const listenToRoom = (code) => {
                roomRef.current = database.ref('rooms/' + code);
                
                roomRef.current.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        setCards(data.cards || []);
                        setFlipped(data.flipped || []);
                        setMatched(data.matched || []);
                        setCurrentPlayer(data.currentPlayer || 1);
                        setScores(data.scores || { player1: 0, player2: 0 });
                        setMatchWins(data.matchWins || { player1: 0, player2: 0 });
                        setReadyForNextRound(data.readyForNextRound || { player1: false, player2: false });
                        setSelectedCategory(data.category || 'animals');
                        setSelectedDifficulty(data.difficulty || 'hard');
                        
                        if (data.players.player2) {
                            setWaitingForPlayer(false);
                        }
                    }
                });
            };

            const updateRoom = async (updates) => {
                if (roomRef.current) {
                    await roomRef.current.update(updates);
                }
            };

            const startNextRound = async () => {
                const config = difficultyConfig[selectedDifficulty];
                const selectedImages = getRandomImages(config.pairs, selectedCategory);
                stopConfetti?.();

                const cardValues = [];
                for (let i = 0; i < config.pairs; i++) {
                    cardValues.push(i, i);
                }
                
                const shuffled = cardValues
                    .map(value => ({ 
                        value, 
                        color: colors[value % colors.length], 
                        animal: selectedImages[value],
                        sort: Math.random() 
                    }))
                    .sort((a, b) => a.sort - b.sort)
                    .map(({ value, color, animal }) => ({ value, color, animal }));

                await updateRoom({
                    cards: shuffled,
                    flipped: [],
                    matched: [],
                    currentPlayer: 1,
                    scores: { player1: 0, player2: 0 },
                    readyForNextRound: { player1: false, player2: false }
                });
            };

            const handleReadyForNextRound = async () => {
                const newReady = {
                    ...readyForNextRound,
                    [`player${playerNumber}`]: true
                };
                
                await updateRoom({ readyForNextRound: newReady });
                
                if (newReady.player1 && newReady.player2) {
                    setTimeout(() => {
                        startNextRound();
                    }, 500);
                }
            };

            const initLocalGame = () => {
                const selectedImages = getRandomImages(PAIRS, selectedCategory);
                stopConfetti?.();

                const cardValues = [];
                for (let i = 0; i < PAIRS; i++) {
                    cardValues.push(i, i);
                }
                
                const shuffled = cardValues
                    .map(value => ({ 
                        value, 
                        color: colors[value % colors.length], 
                        animal: selectedImages[value],
                        sort: Math.random() 
                    }))
                    .sort((a, b) => a.sort - b.sort)
                    .map(({ value, color, animal }) => ({ value, color, animal }));
                
                setCards(shuffled);
                setFlipped([]);
                setMatched([]);
                setCurrentPlayer(1);
                setScores({ player1: 0, player2: 0 });
                setCanFlip(true);
                setGameMode('local');
            };

            const handleCardClick = async (index) => {
                if (isOnline && currentPlayer !== playerNumber) return;
                if (!canFlip || flipped.includes(index) || matched.includes(index) || flipped.length >= 2) {
                    return;
                }

                const newFlipped = [...flipped, index];
                
                if (isOnline) {
                    await updateRoom({ flipped: newFlipped });
                } else {
                    setFlipped(newFlipped);
                }

                if (newFlipped.length === 2) {
                    setCanFlip(false);
                    const [first, second] = newFlipped;
                    
                    if (cards[first].value === cards[second].value) {
                        setTimeout(async () => {
                            const newMatched = [...matched, first, second];
                            const newScores = {
                                ...scores,
                                [`player${currentPlayer}`]: scores[`player${currentPlayer}`] + 1
                            };
                            
                            if (newMatched.length === TOTAL_CARDS && isOnline) {
                                const newMatchWins = {...matchWins};
                                if (newScores.player1 > newScores.player2) {
                                    newMatchWins.player1 = matchWins.player1 + 1;
                                } else if (newScores.player2 > newScores.player1) {
                                    newMatchWins.player2 = matchWins.player2 + 1;
                                }
                                
                                await updateRoom({
                                    matched: newMatched,
                                    scores: newScores,
                                    matchWins: newMatchWins,
                                    flipped: []
                                });
                            } else if (isOnline) {
                                await updateRoom({
                                    matched: newMatched,
                                    scores: newScores,
                                    flipped: []
                                });
                            } else {
                                setMatched(newMatched);
                                setScores(newScores);
                                setFlipped([]);
                            }
                            setCanFlip(true);
                        }, 600);
                    } else {
                        setTimeout(async () => {
                            const nextPlayer = currentPlayer === 1 ? 2 : 1;
                            
                            if (isOnline) {
                                await updateRoom({
                                    flipped: [],
                                    currentPlayer: nextPlayer
                                });
                            } else {
                                setFlipped([]);
                                setCurrentPlayer(nextPlayer);
                            }
                            setCanFlip(true);
                        }, 600);
                    }
                }
            };

            const backToMenu = () => {
                if (roomRef.current) {
                    roomRef.current.off();
                }
stopConfetti?.();
                setGameMode('menu');
                setRoomCode('');
                setJoinCode('');
                setPlayerNumber(null);
                setWaitingForPlayer(false);
                setCards([]);
                setFlipped([]);
                setMatched([]);
                setCurrentPlayer(1);
                setScores({ player1: 0, player2: 0 });
                setMatchWins({ player1: 0, player2: 0 });
                setReadyForNextRound({ player1: false, player2: false });
            };

            const isGameOver = matched.length === TOTAL_CARDS;
            const isSeriesOver = matchWins.player1 >= 2 || matchWins.player2 >= 2;
            const totalGamesPlayed = matchWins.player1 + matchWins.player2;

            if (gameMode === 'menu') {
    return (
        <div className="h-screen p-4 flex items-center justify-center" style={{
            backgroundImage: 'url(images/meadow.png)',
            backgroundSize: 'cover',
            backgroundPosition: 'center'
        }}>
                        <div className="rounded-2xl shadow-2xl p-8 max-w-md w-full border border-yellow-500" style={{
    backgroundColor: 'rgba(181, 101, 29, 0.75)',
    backdropFilter: 'blur(1px)'
}}>
                             <h1 className="text-5xl text-center mb-8 text-yellow-500" style={{ fontFamily: 'Great Vibes, cursive' }}> Pexeso <span className="text-sm align-top text-yellow-400">for Mydli</span>
</h1>

                            <div className="space-y-4">
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-300 mb-2">Choose a motive:</label>
                                    <select
                                        value={selectedCategory}
                                        onChange={(e) => setSelectedCategory(e.target.value)}
                                        className="w-full px-4 py-3 bg-gray-700 text-white rounded-lg border border-yellow-600 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                    >
                                        {Object.entries(categories).map(([key, cat]) => (
                                            <option key={key} value={key}>{cat.name}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-300 mb-2">Difficulty:</label>
                                    <select
                                        value={selectedDifficulty}
                                        onChange={(e) => setSelectedDifficulty(e.target.value)}
                                        className="w-full px-4 py-3 bg-gray-700 text-white rounded-lg border border-yellow-600 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                    >
                                        {Object.entries(difficultyConfig).map(([key, config]) => (
                                            <option key={key} value={key}>
                                                {config.name} ({config.pairs} pairs)
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <button
                                    onClick={initLocalGame}
                                    className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-6 rounded-lg text-xl transition-all transform hover:scale-105"
                                >
                                    2 players on this device
                                </button>

                                <div className="border-t-2 border-yellow-300 my-6"></div>
                                
                                <button
                                    onClick={createRoom}
                                    className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-lg text-xl transition-all transform hover:scale-105"
                                >
                                    Play online with a friend
                                </button>

                                <div className="space-y-2">
                                    <input
                                        type="text"
                                        placeholder="Game code (5 digits)"
                                        value={joinCode}
                                        onChange={(e) => setJoinCode(e.target.value)}
                                        className="w-full px-4 py-3 border-2 border-yellow-600 bg-gray-700 text-white rounded-lg text-center text-xl font-mono uppercase placeholder-gray-400"
                                        maxLength="5"
                                        pattern="\d{5}"
                                        inputMode="numeric"
                                    />

                                    <button
                                        onClick={joinRoom}
                                        className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-lg text-xl transition-all transform hover:scale-105"
                                    >
                                        Join the game
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (waitingForPlayer) {
                return (
    <div className="h-screen p-4 flex items-center justify-center" style={{
        backgroundImage: 'url(images/meadow.png)',
        backgroundSize: 'cover',
        backgroundPosition: 'center'
    }}>
                        <div className="bg-gray-800 rounded-2xl shadow-2xl p-8 max-w-md w-full text-center border border-yellow-700">
                            <h2 className="text-3xl font-bold mb-4 text-white">Waiting for player...</h2>
                            <div className="bg-gray-700 rounded-lg p-6 mb-6 border border-yellow-600">
                                <p className="text-sm text-gray-400 mb-2">Game code:</p>
                                <p className="text-4xl font-mono font-bold text-purple-400">{roomCode}</p>
                            </div>

<script>
  let stopConfetti = () => {};

  function launchConfetti(duration = 3000) {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const confettiCount = 1200;
    const confetti = [];

    for (let i = 0; i < confettiCount; i++) {
      confetti.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 6 + 4,
        d: Math.random() * confettiCount,
        color: `hsl(${Math.random() * 360}, 100%, 50%)`,
        tilt: Math.floor(Math.random() * 10) - 10,
        tiltAngle: 0,
        tiltAngleIncrement: Math.random() * 0.07 + 0.05
      });
    }

    let animationFrame;
    let stop = false;

    function draw() {
      if (stop) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confetti.forEach(c => {
        c.tiltAngle += c.tiltAngleIncrement;
        c.y += 1.1;
        c.x += Math.sin(c.tiltAngle) * 2;
        ctx.beginPath();
        ctx.lineWidth = c.r;
        ctx.strokeStyle = c.color;
        ctx.moveTo(c.x + c.tilt, c.y);
        ctx.lineTo(c.x, c.y + c.tilt + c.r);
        ctx.stroke();
      });
      animationFrame = requestAnimationFrame(draw);
    }

    draw();

    const timer = setTimeout(() => {
      stopConfetti();
    }, duration);

    window.addEventListener('keydown', () => {
      stopConfetti();
    }, { once: true });

    stopConfetti = () => {
      stop = true;
      clearTimeout(timer);
      cancelAnimationFrame(animationFrame);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
  }
</script>

if ('serviceWorker' in navigator) {
