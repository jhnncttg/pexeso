<!DOCTYPE html>
<html lang="cs">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#9333ea">
    <title>Pexeso</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --vh: 1vh;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            touch-action: manipulation;
            background-color: #1a1a2e;
            height: 100dvh;
            overflow: hidden;
        }

        /* === ČTVERCOVÉ KARTY – HLAVNÍ FIX === */
        .game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            box-sizing: border-box;
        }

        .game-grid {
            display: grid;
            gap: 0.35rem;
            width: 100%;
            height: 100%;
            max-width: 90vmin;
            max-height: 90vmin;
            aspect-ratio: 1 / 1; /* Zaručí čtverec */
        }

        @media (orientation: portrait) {
            .game-grid {
                grid-template-columns: repeat(6, 1fr);
                grid-template-rows: repeat(6, 1fr);
            }
        }

        @media (orientation: landscape) {
            .game-grid {
                grid-template-columns: repeat(10, 1fr);
                grid-template-rows: repeat(10, 1fr);
            }
        }

        /* Každá karta je čtverec */
        .card-button {
            width: 100%;
            height: 100%;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 0.5rem;
            overflow: hidden;
            transition: transform 0.2s ease;
            aspect-ratio: 1 / 1;
        }

        .card-button:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .card-back {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #6B7280 0%, #4B5563 100%);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .card-front {
            width: 100%;
            height: 100%;
            background-color: #1a1a2e;
            border-radius: 0.5rem;
            padding: 12%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 640px) {
            .game-grid { gap: 0.25rem; }
            .card-front { padding: 8%; }
            .card-back, .card-front, .card-button { border-radius: 0.3rem; }
        }

        @supports not (height: 100dvh) {
            body { height: 100vh; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBLtCRf4_OYedrTrdizRRCFLN0FIk-bnIE",
            authDomain: "pexeso-game.firebaseapp.com",
            databaseURL: "https://pexeso-game-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pexeso-game",
            storageBucket: "pexeso-game.firebasestorage.app",
            messagingSenderId: "1770108821",
            appId: "1:1770108821:web:53089614906957421fe89c"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const categories = {
            animals: { name: "Zvířata", images: [
                'images/animals/amstaf.png', 'images/animals/bear.png', 'images/animals/bengal.png',
                'images/animals/bird.png', 'images/animals/bonemouth.png', 'images/animals/butterfly.png',
                'images/animals/cat.png', 'images/animals/chicken.png', 'images/animals/cobra.png',
                'images/animals/dog.png', 'images/animals/dolphin.png', 'images/animals/elephant.png',
                'images/animals/fenix.png', 'images/animals/fish.png', 'images/animals/frog.png',
                'images/animals/girafe.png', 'images/animals/goat.png', 'images/animals/gorila.png',
                'images/animals/hamster.png', 'images/animals/horse.png', 'images/animals/kokr.png',
                'images/animals/labrador.png', 'images/animals/labut.png', 'images/animals/leguan.png',
                'images/animals/levhart.png', 'images/animals/lion.png', 'images/animals/monkey.png',
                'images/animals/motyl.png', 'images/animals/neon.png', 'images/animals/parrot.png',
                'images/animals/pav.png', 'images/animals/pelikan.png', 'images/animals/pinguin.png',
                'images/animals/retrivr.png', 'images/animals/rotvik.png', 'images/animals/skalar.png',
                'images/animals/star.png', 'images/animals/sykora.png', 'images/animals/tiger.png',
                'images/animals/turtle.png', 'images/animals/vlcak.png', 'images/animals/wolf.png'
            ]},
            biblical: { name: "Biblické", images: [
                "images/biblical/aron.png", "images/biblical/baptizo.png", "images/biblical/Dorkas.png",
                "images/biblical/farizeus.png", "images/biblical/fish.png", "images/biblical/fisherman.png",
                "images/biblical/grave.png", "images/biblical/herodes.png", "images/biblical/jericho.png",
                "images/biblical/jesus.png", "images/biblical/jesuscloud.png", "images/biblical/jesuszjeveni.png",
                "images/biblical/jidas.png", "images/biblical/john.png", "images/biblical/Josef.png",
                "images/biblical/jozue2.png", "images/biblical/lazar.png", "images/biblical/maria.png",
                "images/biblical/moses.png", "images/biblical/natanael.png", "images/biblical/onezim.png",
                "images/biblical/oslatko.png", "images/biblical/ovce.png", "images/biblical/palm.png",
                "images/biblical/paul.png", "images/biblical/sea.png", "images/biblical/snake.png",
                "images/biblical/sun.png", "images/biblical/wine.png", "images/biblical/zebedej.png"
            ]}
        };

        const PexesoGame = () => {
            const TOTAL_CARDS = 60;
            const PAIRS = 30;

            const [gameMode, setGameMode] = useState('menu');
            const [selectedCategory, setSelectedCategory] = useState('animals');
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);
            const [currentPlayer, setCurrentPlayer] = useState(1);
            const [scores, setScores] = useState({ player1: 0, player2: 0 });
            const [canFlip, setCanFlip] = useState(true);
            const [roomCode, setRoomCode] = useState('');
            const [joinCode, setJoinCode] = useState('');
            const [playerNumber, setPlayerNumber] = useState(null);
            const [waitingForPlayer, setWaitingForPlayer] = useState(false);

            const roomRef = useRef(null);
            const isOnline = gameMode === 'online';

            const getRandomImages = (count, catKey) => {
                const cat = categories[catKey];
                if (!cat || cat.images.length < count) return [];
                const shuffled = [...cat.images].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, count);
            };

            const generateRoomCode = () => {
                const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                return letters.charAt(Math.floor(Math.random() * 26)) + letters.charAt(Math.floor(Math.random() * 26));
            };

            const createRoom = async () => {
                const code = generateRoomCode();
                const images = getRandomImages(PAIRS, selectedCategory);
                const values = [];
                for (let i = 0; i < PAIRS; i++) values.push(i, i);
                const shuffled = values
                    .map((v, i) => ({ value: v, animal: images[Math.floor(i/2)], sort: Math.random() }))
                    .sort((a, b) => a.sort - b.sort)
                    .map(({ value, animal }) => ({ value, animal }));

                await database.ref('rooms/' + code).set({
                    cards: shuffled, flipped: [], matched: [], currentPlayer: 1,
                    scores: { player1: 0, player2: 0 }, players: { player1: true, player2: false },
                    category: selectedCategory
                });

                setRoomCode(code); setPlayerNumber(1); setGameMode('online'); setWaitingForPlayer(true);
                listenToRoom(code);
            };

            const joinRoom = async () => {
                const code = joinCode.trim().toUpperCase();
                const snap = await database.ref('rooms/' + code).once('value');
                if (!snap.exists()) return alert('Místnost nenalezena!');
                if (snap.val().players.player2) return alert('Místnost plná!');
                await database.ref('rooms/' + code + '/players/player2').set(true);
                setRoomCode(code); setPlayerNumber(2); setGameMode('online'); setWaitingForPlayer(false);
                listenToRoom(code);
            };

            const listenToRoom = (code) => {
                roomRef.current = database.ref('rooms/' + code);
                roomRef.current.on('value', snap => {
                    const data = snap.val();
                    if (data) {
                        setCards(data.cards || []);
                        setFlipped(data.flipped || []);
                        setMatched(data.matched || []);
                        setCurrentPlayer(data.currentPlayer || 1);
                        setScores(data.scores || { player1: 0, player2: 0 });
                        setSelectedCategory(data.category || 'animals');
                        if (data.players.player2) setWaitingForPlayer(false);
                    }
                });
            };

            const updateRoom = async (updates) => {
                if (roomRef.current) await roomRef.current.update(updates);
            };

            const initLocalGame = () => {
                const images = getRandomImages(PAIRS, selectedCategory);
                const values = [];
                for (let i = 0; i < PAIRS; i++) values.push(i, i);
                const shuffled = values
                    .map((v, i) => ({ value: v, animal: images[Math.floor(i/2)], sort: Math.random() }))
                    .sort((a, b) => a.sort - b.sort)
                    .map(({ value, animal }) => ({ value, animal }));
                setCards(shuffled); setFlipped([]); setMatched([]); setCurrentPlayer(1);
                setScores({ player1: 0, player2: 0 }); setCanFlip(true); setGameMode('local');
            };

            const handleCardClick = async (index) => {
                if (isOnline && currentPlayer !== playerNumber) return;
                if (!canFlip || flipped.includes(index) || matched.includes(index) || flipped.length >= 2) return;

                const newFlipped = [...flipped, index];
                if (isOnline) await updateRoom({ flipped: newFlipped });
                else setFlipped(newFlipped);

                if (newFlipped.length === 2) {
                    setCanFlip(false);
                    const [a, b] = newFlipped;
                    if (cards[a].value === cards[b].value) {
                        setTimeout(async () => {
                            const newMatched = [...matched, a, b];
                            const newScores = { ...scores, [`player${currentPlayer}`]: scores[`player${currentPlayer}`] + 1 };
                            if (isOnline) {
                                await updateRoom({ matched: newMatched, scores: newScores, flipped: [] });
                            } else {
                                setMatched(newMatched); setScores(newScores); setFlipped([]);
                            }
                            setCanFlip(true);
                        }, 600);
                    } else {
                        setTimeout(async () => {
                            const next = currentPlayer === 1 ? 2 : 1;
                            if (isOnline) await updateRoom({ flipped: [], currentPlayer: next });
                            else { setFlipped([]); setCurrentPlayer(next); }
                            setCanFlip(true);
                        }, 600);
                    }
                }
            };

            const backToMenu = () => {
                if (roomRef.current) roomRef.current.off();
                setGameMode('menu'); setRoomCode(''); setJoinCode(''); setPlayerNumber(null);
                setWaitingForPlayer(false); setCards([]); setFlipped([]); setMatched([]);
                setCurrentPlayer(1); setScores({ player1: 0, player2: 0 });
            };

            if (gameMode === 'menu') {
                return (
                    <div className="h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 p-4 flex items-center justify-center">
                        <div className="bg-gray-800 rounded-2xl p-8 max-w-md w-full text-center border border-gray-700">
                            <h1 className="text-4xl font-bold mb-8 text-purple-400">Pexeso</h1>
                            <select value={selectedCategory} onChange={e => setSelectedCategory(e.target.value)}
                                className="w-full mb-4 px-4 py-3 bg-gray-700 text-white rounded-lg">
                                {Object.entries(categories).map(([k, v]) => <option key={k} value={k}>{v.name}</option>)}
                            </select>
                            <button onClick={initLocalGame} className="w-full mb-3 bg-blue-500 hover:bg-blue-600 text-white py-4 rounded-lg font-bold">Lokální hra</button>
                            <button onClick={createRoom} className="w-full mb-3 bg-green-500 hover:bg-green-600 text-white py-4 rounded-lg font-bold">Vytvořit místnost</button>
                            <input type="text" placeholder="Kód" value={joinCode} onChange={e => setJoinCode(e.target.value.toUpperCase())}
                                className="w-full mb-2 px-4 py-3 bg-gray-700 text-white rounded-lg text-center font-mono" maxLength="2" />
                            <button onClick={joinRoom} className="w-full bg-purple-500 hover:bg-purple-600 text-white py-4 rounded-lg font-bold">Připojit se</button>
                        </div>
                    </div>
                );
            }

            if (waitingForPlayer) {
                return (
                    <div className="h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 p-4 flex items-center justify-center">
                        <div className="bg-gray-800 rounded-2xl p-8 text-center">
                            <h2 className="text-3xl font-bold text-white mb-4">Čekám na hráče...</h2>
                            <p className="text-4xl font-mono text-purple-400">{roomCode}</p>
                            <button onClick={backToMenu} className="mt-6 bg-red-500 text-white px-6 py-2 rounded-lg">Zpět</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 p-2 flex flex-col">
                    <div className="max-w-2xl mx-auto w-full flex flex-col h-full gap-2">
                        <div className="flex justify-between items-center">
                            <button onClick={backToMenu} className="bg-red-500 text-white px-3 py-1 rounded-lg text-sm">Menu</button>
                            <h1 className="text-2xl font-bold text-white">Pexeso</h1>
                            {isOnline && <div className="bg-gray-700 px-3 py-1 rounded-lg text-sm font-mono text-white">{roomCode}</div>}
                        </div>

                        <div className="bg-gray-800 rounded-lg p-2 border border-gray-700">
                            <div className="flex justify-between items-center">
                                <div className={`flex-1 p-2 rounded-lg text-center ${currentPlayer === 1 ? 'bg-blue-500 text-white' : 'bg-gray-700 text-gray-300'}`}>
                                    <div className="text-sm font-bold">Hráč 1</div>
                                    <div className="text-2xl font-bold">{scores.player1}</div>
                                </div>
                                {!isOnline && (
                                    <button onClick={initLocalGame} className="mx-2 bg-green-500 p-2 rounded-full">
                                        <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                                    </button>
                                )}
                                <div className={`flex-1 p-2 rounded-lg text-center ${currentPlayer === 2 ? 'bg-red-500 text-white' : 'bg-gray-700 text-gray-300'}`}>
                                    <div className="text-sm font-bold">Hráč 2</div>
                                    <div className="text-2xl font-bold">{scores.player2}</div>
                                </div>
                            </div>
                        </div>

                        <div className="game-container">
                            <div className="game-grid">
                                {cards.map((card, i) => {
                                    const isFlipped = flipped.includes(i);
                                    const isMatched = matched.includes(i);
                                    return (
                                        <button key={i} onClick={() => handleCardClick(i)} className="card-button"
                                            disabled={!canFlip || isFlipped || isMatched || (isOnline && currentPlayer !== playerNumber)}>
                                            {!isFlipped && !isMatched ? (
                                                <div className="card-back">
                                                    <span className="text-white text-4xl" style={{fontFamily: 'Great Vibes, cursive'}}>A</span>
                                                </div>
                                            ) : (
                                                <div className="card-front">
                                                    <img src={card.animal} alt="" />
                                                </div>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const setVH = () => {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        };
        window.addEventListener('load', setVH);
        window.addEventListener('resize', setVH);
        window.addEventListener('orientationchange', () => setTimeout(setVH, 100));

        ReactDOM.render(<PexesoGame />, document.getElementById('root'));
    </script>
</body>
</html>
