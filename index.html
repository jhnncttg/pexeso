<!DOCTYPE html>
<html lang="cs">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#9333ea">
    <title>Pexeso</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            touch-action: manipulation;
            background-color: #1a1a2e;
            height: 100vh;
            overflow: hidden;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 2px;
            background-color: transparent;
            display: block;
        }

        .game-grid {
            display: grid;
            gap: 0.25rem;
            width: 100%;
            height: 100%;
            margin: 0 auto;
        }

        @media (orientation: portrait) {
            .game-grid {
                grid-template-columns: repeat(6, 1fr);
                grid-template-rows: repeat(10, 1fr);
                max-width: 60vh;
            }
        }

        @media (orientation: landscape) {
            .game-grid {
                grid-template-columns: repeat(10, 1fr);
                grid-template-rows: repeat(6, 1fr);
                max-width: 100vh;
            }
        }

        .card-button {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 0.5rem;
            transition: all 0.3s;
        }

        @media (max-width: 640px) {
            .game-grid { gap: 0.15rem; }
            .card-button { border-radius: 0.25rem; }
        }

        /* === iOS SAFARI FIX === */
        @supports (-webkit-touch-callout: none) {
            body, .game-grid { height: -webkit-fill-available; }
            @media (orientation: portrait) { .game-grid { max-width: 60dvh; } }
            @media (orientation: landscape) { .game-grid { max-width: 100dvh; } }
        }

        /* === ZMENŠENÝ SKÓRE PANEL === */
        .score-panel {
            padding: 0.5rem;
            gap: 0.5rem;
        }
        .score-box {
            padding: 0.4rem 0.6rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
        }
        .score-box .label { font-size: 0.7rem; }
        .score-box .value { font-size: 1.1rem; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef } = React;

        const firebaseConfig = { /* tvůj config */ };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const categories = { /* tvůj seznam */ };

        const PexesoGame = () => {
            const ROWS = 10, COLS = 6, TOTAL_CARDS = 60, PAIRS = 30;

            const [gameMode, setGameMode] = useState('menu');
            const [selectedCategory, setSelectedCategory] = useState('animals');
            const [roomCode, setRoomCode] = useState('');
            const [joinCode, setJoinCode] = useState('');
            const [playerNumber, setPlayerNumber] = useState(null);
            const [waitingForPlayer, setWaitingForPlayer] = useState(false);
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);
            const [currentPlayer, setCurrentPlayer] = useState(1);
            const [scores, setScores] = useState({ player1: 0, player2: 0 });
            const [canFlip, setCanFlip] = useState(true);
            const [matchWins, setMatchWins] = useState({ player1: 0, player2: 0 });
            const [readyForNextRound, setReadyForNextRound] = useState({ player1: false, player2: false });

            const roomRef = useRef(null);
            const isOnline = gameMode === 'online';

            const colors = [ /* tvůj seznam */ ];

            const getRandomImages = (count, cat) => {
                const images = categories[cat]?.images || [];
                const shuffled = [...images].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, count);
            };

            const generateRoomCode = () => 'AB'.replace(/./g, () => 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random() * 26)]);

            const createRoom = async () => {
                const code = generateRoomCode();
                const images = getRandomImages(PAIRS, selectedCategory);
                const values = Array.from({length: PAIRS}, (_, i) => [i, i]).flat();
                const shuffled = values
                    .map((v, i) => ({ value: v, animal: images[Math.floor(i/2)], sort: Math.random() }))
                    .sort((a, b) => a.sort - b.sort)
                    .map(({ value, animal }) => ({ value, animal }));

                await database.ref('rooms/' + code).set({
                    cards: shuffled, flipped: [], matched: [], currentPlayer: 1,
                    scores: { player1: 0, player2: 0 }, matchWins: { player1: 0, player2: 0 },
                    readyForNextRound: { player1: false, player2: false },
                    players: { player1: true, player2: false }, category: selectedCategory
                });

                setRoomCode(code); setPlayerNumber(1); setGameMode('online'); setWaitingForPlayer(true);
                listenToRoom(code);
            };

            const joinRoom = async () => {
                const code = joinCode.trim().toUpperCase();
                const snap = await database.ref('rooms/' + code).once('value');
                if (!snap.exists()) return alert('Místnost nenalezena!');
                if (snap.val().players.player2) return alert('Místnost plná!');
                setSelectedCategory(snap.val().category || 'animals');
                await database.ref('rooms/' + code + '/players/player2').set(true);
                setRoomCode(code); setPlayerNumber(2); setGameMode('online'); setWaitingForPlayer(false);
                listenToRoom(code);
            };

            const listenToRoom = (code) => {
                roomRef.current = database.ref('rooms/' + code);
                roomRef.current.on('value', snap => {
                    const data = snap.val();
                    if (data) {
                        setCards(data.cards || []);
                        setFlipped(data.flipped || []);
                        setMatched(data.matched || []);
                        setCurrentPlayer(data.currentPlayer || 1);
                        setScores(data.scores || { player1: 0, player2: 0 });
                        setMatchWins(data.matchWins || { player1: 0, player2: 0 });
                        setReadyForNextRound(data.readyForNextRound || { player1: false, player2: false });
                        setSelectedCategory(data.category || 'animals');
                        if (data.players.player2) setWaitingForPlayer(false);
                    }
                });
            };

            const updateRoom = async (updates) => roomRef.current && await roomRef.current.update(updates);

            const initLocalGame = () => {
                const images = getRandomImages(PAIRS, selectedCategory);
                const values = Array.from({length: PAIRS}, (_, i) => [i, i]).flat();
                const shuffled = values
                    .map((v, i) => ({ value: v, animal: images[Math.floor(i/2)], sort: Math.random() }))
                    .sort((a, b) => a.sort - b.sort)
                    .map(({ value, animal }) => ({ value, animal }));
                setCards(shuffled); setFlipped([]); setMatched([]); setCurrentPlayer(1);
                setScores({ player1: 0, player2: 0 }); setCanFlip(true); setGameMode('local');
            };

            const handleCardClick = async (index) => {
                if (isOnline && currentPlayer !== playerNumber) return;
                if (!canFlip || flipped.includes(index) || matched.includes(index) || flipped.length >= 2) return;

                const newFlipped = [...flipped, index];
                if (isOnline) await updateRoom({ flipped: newFlipped });
                else setFlipped(newFlipped);

                if (newFlipped.length === 2) {
                    setCanFlip(false);
                    const [a, b] = newFlipped;
                    if (cards[a].value === cards[b].value) {
                        setTimeout(async () => {
                            const newMatched = [...matched, a, b];
                            const newScores = { ...scores, [`player${currentPlayer}`]: scores[`player${currentPlayer}`] + 1 };
                            if (isOnline) await updateRoom({ matched: newMatched, scores: newScores, flipped: [] });
                            else { setMatched(newMatched); setScores(newScores); setFlipped([]); }
                            setCanFlip(true);
                        }, 600);
                    } else {
                        setTimeout(async () => {
                            const next = currentPlayer === 1 ? 2 : 1;
                            if (isOnline) await updateRoom({ flipped: [], currentPlayer: next });
                            else { setFlipped([]); setCurrentPlayer(next); }
                            setCanFlip(true);
                        }, 600);
                    }
                }
            };

            const backToMenu = () => {
                roomRef.current?.off();
                setGameMode('menu'); setRoomCode(''); setJoinCode(''); setPlayerNumber(null);
                setWaitingForPlayer(false); setCards([]); setFlipped([]); setMatched([]);
                setCurrentPlayer(1); setScores({ player1: 0, player2: 0 });
                setMatchWins({ player1: 0, player2: 0 }); setReadyForNextRound({ player1: false, player2: false });
            };

            const isGameOver = matched.length === TOTAL_CARDS;

            if (gameMode === 'menu') {
                return (
                    <div className="h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 p-4 flex items-center justify-center">
                        <div className="bg-gray-800 rounded-2xl p-6 max-w-xs w-full text-center border border-gray-700">
                            <h1 className="text-3xl font-bold mb-6 text-purple-400">Pexeso</h1>
                            <select value={selectedCategory} onChange={e => setSelectedCategory(e.target.value)}
                                className="w-full mb-3 px-3 py-2 bg-gray-700 text-white rounded-lg text-sm">
                                {Object.entries(categories).map(([k, v]) => <option key={k} value={k}>{v.name}</option>)}
                            </select>
                            <button onClick={initLocalGame} className="w-full mb-2 bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg text-sm font-bold">Lokální hra</button>
                            <button onClick={createRoom} className="w-full mb-2 bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg text-sm font-bold">Vytvořit místnost</button>
                            <input type="text" placeholder="Kód" value={joinCode} onChange={e => setJoinCode(e.target.value.toUpperCase())}
                                className="w-full mb-1 px-3 py-2 bg-gray-700 text-white rounded-lg text-center font-mono text-sm" maxLength="2" />
                            <button onClick={joinRoom} className="w-full bg-purple-500 hover:bg-purple-600 text-white py-3 rounded-lg text-sm font-bold">Připojit se</button>
                        </div>
                    </div>
                );
            }

            if (waitingForPlayer) {
                return (
                    <div className="h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 p-4 flex items-center justify-center">
                        <div className="bg-gray-800 rounded-2xl p-6 text-center">
                            <h2 className="text-2xl font-bold text-white mb-3">Čekám na hráče...</h2>
                            <p className="text-3xl font-mono text-purple-400">{roomCode}</p>
                            <button onClick={backToMenu} className="mt-4 bg-red-500 text-white px-5 py-2 rounded-lg text-sm">Zpět</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 p-1 flex flex-col">
                    <div className="max-w-2xl mx-auto w-full h-full flex flex-col gap-1">
                        <div className="flex justify-between items-center text-white text-xs">
                            <button onClick={backToMenu} className="bg-red-500 px-2 py-1 rounded text-xs">Menu</button>
                            <h1 className="font-bold">Pexeso</h1>
                            {isOnline && <div className="bg-gray-700 px-2 py-1 rounded text-xs font-mono">{roomCode}</div>}
                        </div>

                        {/* ZMENŠENÝ SKÓRE PANEL */}
                        <div className="score-panel bg-gray-800 rounded-lg border border-gray-700 flex items-center justify-between">
                            <div className={`score-box flex-1 text-center ${currentPlayer === 1 ? 'bg-blue-500 text-white' : 'bg-gray-700 text-gray-300'}`}>
                                <div className="label">Hráč 1 {isOnline && playerNumber === 1 && '(Ty)'}</div>
                                <div className="value font-bold">{scores.player1}</div>
                            </div>
                            {!isOnline && (
                                <button onClick={initLocalGame} className="mx-1 bg-green-500 p-1.5 rounded-full">
                                    <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                                </button>
                            )}
                            <div className={`score-box flex-1 text-center ${currentPlayer === 2 ? 'bg-red-500 text-white' : 'bg-gray-700 text-gray-300'}`}>
                                <div className="label">Hráč 2 {isOnline && playerNumber === 2 && '(Ty)'}</div>
                                <div className="value font-bold">{scores.player2}</div>
                            </div>
                        </div>

                        {/* GRID – PLNÁ VÝŠKA */}
                        <div className="flex-1 bg-gray-800 rounded-lg p-1 border border-gray-700 overflow-hidden">
                            <div className="game-grid">
                                {cards.map((card, i) => {
                                    const isFlipped = flipped.includes(i);
                                    const isMatched = matched.includes(i);
                                    return (
                                        <button key={i} onClick={() => handleCardClick(i)} className="card-button"
                                            style={{ backgroundColor: isFlipped || isMatched ? 'transparent' : '#6B7280' }}
                                            disabled={!canFlip || isFlipped || isMatched || (isOnline && currentPlayer !== playerNumber)}>
                                            <div className="w-full h-full flex items-center justify-center">
                                                {isFlipped || isMatched ? 
                                                    <img src={card.animal} alt="" className="card-image" /> : 
                                                    <span style={{fontFamily: 'Great Vibes, cursive', color: 'black', fontSize: '1.5rem'}}>A</span>
                                                }
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<PexesoGame />, document.getElementById('root'));
    </script>
</body>
</html>
